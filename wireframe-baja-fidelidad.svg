      <rect x="1039" y="338" width="85" height="118" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
      <rect x="1133" y="338" width="85" height="118" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
